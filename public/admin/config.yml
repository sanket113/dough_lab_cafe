backend:
  name: github
  repo: your-github-username/pizza-cafe # TODO: Update this to real repo
  branch: main 

local_backend: true # Allow testing CMS locally

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "menu"
    label: "Menu Items"
    folder: "src/content/menu"
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Price", name: "price", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["Signature Sourdough", "New York Style", "Classic Dough", "Chicago Style Deep Dish", "Sourdough Sandwich", "Fries", "Beverages"]}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Is Vegetarian", name: "isVeg", widget: "boolean", default: true}

  - name: "outlet"
    label: "Outlet Info"
    file: "src/content/outlet/info.json"
    format: "json"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "About Text", name: "about", widget: "text"}
      - {label: "Address", name: "address", widget: "string"}
      - {label: "Phone", name: "phone", widget: "string"}
      - {label: "Video Background URL", name: "video", widget: "string", required: false}
      - {label: "Photos", name: "photos", widget: "list", field: {label: "Photo", name: "photo", widget: "image"}}
